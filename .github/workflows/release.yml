# Rilascio della PWA: a ogni avanzamento di main l'analisi e i test sono
# eseguiti, l'immagine e' costruita e pubblicata sul registry, e il repository
# di distribuzione e' avvisato perche' aggiorni l'ambiente di esercizio.
name: Rilascio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR ammette soltanto nomi in minuscolo.
  IMAGE_NAME: ghcr.io/raff120/healthylog-fe
  FLUTTER_VERSION: 3.47.2

jobs:

  test:
    name: Verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Risoluzione delle dipendenze
        run: flutter pub get

      - name: Analisi statica
        # Le segnalazioni informative non bloccano il rilascio: allo stato sono
        # dodici, tutte della regola di stile `use_null_aware_elements`. Errori
        # e avvisi restano invece ostativi.
        run: flutter analyze --no-fatal-infos

      - name: Esecuzione dei test
        run: flutter test

  publish:
    name: Costruzione e pubblicazione dell'immagine
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Costruzione e pubblicazione
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Avviso al repository di distribuzione
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Invio della notifica
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Segreto DEPLOY_DISPATCH_TOKEN assente: nessuna notifica inviata."
            echo "L'immagine e' comunque pubblicata; l'ambiente di esercizio va aggiornato a mano."
            exit 0
          fi
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/Raff120/healthylog-deploy/dispatches \
            -d "{\"event_type\":\"frontend-released\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
