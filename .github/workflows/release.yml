# Rilascio della PWA: a ogni avanzamento di main versione e numero di build
# sono calcolati, l'analisi e i test sono eseguiti, l'immagine e' costruita e
# pubblicata sul registry, la versione e' fissata con un tag e una release di
# GitHub, e il repository di distribuzione e' avvisato perche' aggiorni
# l'ambiente di esercizio.
name: Rilascio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Due rilasci ravvicinati non devono calcolare la stessa versione: il secondo
# attende che il primo abbia creato il proprio tag.
concurrency:
  group: rilascio
  cancel-in-progress: false

env:
  # GHCR ammette soltanto nomi in minuscolo.
  IMAGE_NAME: ghcr.io/raff120/healthylog-fe
  FLUTTER_VERSION: 3.47.2
  # Versione adottata dal primo rilascio numerato, in assenza di tag.
  INITIAL_VERSION: 1.0.0

jobs:

  version:
    name: Calcolo di versione e build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      build: ${{ steps.compute.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag e storia completa: la versione dipende dai commit successivi
          # all'ultimo tag, il build dal numero dei commit.
          fetch-depth: 0

      - name: Calcolo
        id: compute
        run: |
          version="$(.github/scripts/next-version.sh "$INITIAL_VERSION")"
          # VR-21: unico per tutte le piattaforme e crescente a ogni rilascio,
          # poiche' main avanza soltanto.
          build="$(git rev-list --count HEAD)"
          echo "Versione del rilascio: $version (build $build)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  test:
    name: Verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Risoluzione delle dipendenze
        run: flutter pub get

      - name: Analisi statica
        # Le segnalazioni informative non bloccano il rilascio: allo stato sono
        # dodici, tutte della regola di stile `use_null_aware_elements`. Errori
        # e avvisi restano invece ostativi.
        run: flutter analyze --no-fatal-infos

      - name: Esecuzione dei test
        run: flutter test

  publish:
    name: Costruzione e pubblicazione dell'immagine
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Costruzione e pubblicazione
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            API_BASE_URL=/api
            BUILD_NAME=${{ needs.version.outputs.version }}
            BUILD_NUMBER=${{ needs.version.outputs.build }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag e release della versione
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Creazione del tag e della release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          tag="v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Il tag $tag esiste gia': nessuna nuova release."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag (build $BUILD)" \
            --generate-notes

  notify:
    name: Avviso al repository di distribuzione
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Invio della notifica
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Segreto DEPLOY_DISPATCH_TOKEN assente: nessuna notifica inviata."
            echo "L'immagine e' comunque pubblicata; l'ambiente di esercizio va aggiornato a mano."
            exit 0
          fi
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/Raff120/healthylog-deploy/dispatches \
            -d "{\"event_type\":\"frontend-released\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
