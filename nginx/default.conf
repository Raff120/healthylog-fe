# nginx serve la PWA e funge da reverse proxy verso il backend, cosi' che
# applicazione e API si presentino sul medesimo dominio (CT-16). La
# coincidenza di dominio rende superflua la configurazione CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rinnovo dei certificati: la verifica di Let's Encrypt legge da qui.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API del backend. La barra finale in proxy_pass toglie il prefisso /api,
    # che il backend non conosce.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # L'indice e il service worker non vanno conservati in cache: diversamente
    # un aggiornamento della PWA non raggiungerebbe i dispositivi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Le risorse portano un'impronta nel nome e possono essere conservate a lungo.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Ogni schermata corrisponde a un indirizzo condivisibile (FE-3, MP-9):
    # gli indirizzi sconosciuti a nginx sono affidati all'applicazione.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
