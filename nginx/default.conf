# nginx serve la PWA e funge da reverse proxy verso il backend, cosi' che
# applicazione e API si presentino sul medesimo dominio (CT-16). La
# coincidenza di dominio rende superflua la configurazione CORS.
#
# La terminazione TLS avviene qui (CT-19). I certificati risiedono in un
# volume condiviso con il servizio di rinnovo; al primo avvio, prima che
# Let's Encrypt ne emetta di validi, sono autofirmati: senza di essi nginx
# non potrebbe avviarsi, e senza nginx la verifica del dominio non potrebbe
# compiersi.

# --- Accesso in chiaro ------------------------------------------------------
server {
    listen 80;
    server_name _;

    # La verifica di Let's Encrypt deve restare raggiungibile in chiaro.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Accesso cifrato --------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/healthylog.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healthylog.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # API del backend. La barra finale in proxy_pass toglie il prefisso /api,
    # che il backend non conosce.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # L'indice e il service worker non vanno conservati in cache: diversamente
    # un aggiornamento della PWA non raggiungerebbe i dispositivi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Le risorse portano un'impronta nel nome e possono essere conservate a lungo.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Ogni schermata corrisponde a un indirizzo condivisibile (FE-3, MP-9):
    # gli indirizzi sconosciuti a nginx sono affidati all'applicazione.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
