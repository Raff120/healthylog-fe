# Inoltro al backend, da includere in una location `/api/` (CT-16). La barra
# finale in proxy_pass toglie il prefisso /api, che il backend non conosce.
#
# Sta in un file proprio perché l'accesso pubblico e quello di verifica
# inoltrino nel medesimo modo, pur distinguendosi per la sola manutenzione:
# il primo la dichiara, il secondo ne è escluso (MM-5).

proxy_pass http://backend:8080/;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
