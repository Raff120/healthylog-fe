# Distribuzione della PWA: le direttive comuni all'accesso pubblico e a
# quello di verifica (MM-5), che DEVE servire l'applicazione come il primo.
# Raccolte qui perché i due accessi non divergano nel tempo: una verifica
# compiuta su una configurazione diversa da quella in esercizio non
# verificherebbe l'esercizio.

root /usr/share/nginx/html;
index index.html;

# L'indice e il service worker non si conservano affatto: sono il punto
# da cui ogni aggiornamento si propaga, e devono essere sempre quelli veri.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Ogni schermata corrisponde a un indirizzo condivisibile (FE-3, MP-9):
# gli indirizzi sconosciuti a nginx sono affidati all'applicazione.
location / {
    try_files $uri $uri/ /index.html;

    # Nessuna risorsa prodotta da Flutter porta un'impronta nel nome: né
    # `main.dart.js`, né il caricatore, né gli asset o CanvasKit.
    # Conservarle senza riconvalida — come si faceva qui, sul presupposto
    # contrario — impedisce a un aggiornamento di raggiungere un
    # dispositivo che ha già aperto l'applicazione, per tutta la durata
    # della conservazione.
    #
    # Si conservano dunque con riconvalida obbligatoria: l'ETag riduce la
    # riconvalida a una risposta 304 vuota, e dopo il primo caricamento è
    # il service worker a servirle senza toccare la rete.
    #
    # La dichiarazione sta qui e non nel server: le risposte del backend
    # portano le proprie intestazioni, e non vanno toccate.
    add_header Cache-Control "no-cache" always;
}

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
