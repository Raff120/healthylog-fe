<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Il tuo piano alimentare, giorno per giorno.">

  <!--
    `viewport-fit=cover` estende la pagina sotto le zone riservate del
    dispositivo (barra di stato, indicatore di Home), che vengono poi
    restituite come spaziatura dell'elemento ospite qui sotto. Sopravvive
    solo perché l'applicazione è innestata in un elemento proprio: nella
    modalità a pagina intera il motore Flutter sostituisce d'autorità
    questa dichiarazione con una propria (vedi decisioni.md).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS onora lo stile della barra di stato solo in presenza di questa
       dichiarazione, che è distinta da quella priva di prefisso. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- MP-9: il colore della barra segue il tema del sistema operativo
       finché l'applicazione non è caricata; da lì in avanti queste
       dichiarazioni sono sostituite da una sola, che porta il tema scelto
       dall'Utente (`page_chrome.dart`). -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="HealthyLog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HealthyLog</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Le zone che l'applicazione non dipinge — quella dietro la barra di
      stato, anzitutto — mostrano lo sfondo della pagina: senza queste
      dichiarazioni resterebbe bianco anche a tema scuro. I due valori sono
      `backgroundLight` e `backgroundDark` della palette (`app_palette.dart`):
      è l'unico punto fuori dal tema in cui un colore debba comparire, non
      essendovi modo di attingere alla palette da qui.

      Valgono per il primo disegno, prima che l'applicazione sia caricata, e
      seguono perciò il tema del sistema operativo — il solo noto a quel
      momento. Caricata l'applicazione, lo sfondo prende il tema che
      l'Utente ha scelto (`page_chrome.dart`).
    */
    :root {
      color-scheme: light dark;
      --healthylog-background: #FAF9F7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --healthylog-background: #141312;
      }
    }

    html, body {
      margin: 0;
      height: 100%;
      background-color: var(--healthylog-background);
    }

    /*
      L'applicazione occupa lo schermo intero, rientrata dalle zone riservate
      del dispositivo su tre lati. La rientranza va dichiarata qui: il motore
      Flutter non legge `env(safe-area-inset-*)` e `MediaQuery.padding` resta
      nullo sul web, sicché `SafeArea` non produrrebbe alcuna spaziatura
      (vedi decisioni.md).

      È uno scostamento dei lati, non una spaziatura interna: il motore
      misura l'elemento ospite con `clientHeight`, che comprende la
      spaziatura, mentre vi dipinge dentro un elemento alto il 100% del solo
      riquadro del contenuto. Dichiarata come spaziatura, la rientranza
      entrerebbe nella misura ma non nella superficie dipinta, e
      l'applicazione risulterebbe più alta della propria finestra della
      somma delle zone riservate: il fondo — la barra di navigazione —
      finirebbe tagliato (vedi decisioni.md).

      Il lato inferiore fa eccezione: là l'applicazione arriva al bordo dello
      schermo e la zona riservata la dipinge lei, ricevendone la misura come
      `MediaQuery.padding` (`device_insets.dart`). Sottrarla qui lascerebbe
      una fascia di colore proprio sotto la barra di navigazione, che ha il
      colore della superficie e non quello del fondo: uno stacco visibile che
      nessun valore dichiarato in questa pagina potrebbe evitare, non
      sapendosi di qui che cosa l'applicazione stia mostrando.
    */
    #healthylog {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: 0;
      left: env(safe-area-inset-left);
    }

    /*
      Sonda della zona riservata inferiore: non si vede e non riceve tocchi,
      esiste perché di lì l'applicazione ne legga la misura. `env()` si
      risolve solo dove è usato, e il motore non riferisce queste misure.
    */
    #healthylog-safe-area-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 0;
      height: env(safe-area-inset-bottom);
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="healthylog"></div>
  <div id="healthylog-safe-area-bottom" aria-hidden="true"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
