# Generazione delle traduzioni (LO-1). Il modello è l'italiano, lingua in
# cui l'applicazione è scritta (CN-1): le nuove voci si aggiungono lì e
# `flutter gen-l10n` segnala quelle non ancora tradotte in inglese.
arb-dir: lib/l10n
template-arb-file: app_it.arb
output-localization-file: app_localizations.dart
output-class: L10n
nullable-getter: false
output-dir: lib/l10n/generated
